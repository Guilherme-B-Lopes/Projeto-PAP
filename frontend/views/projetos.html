<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos - CURSOS PROFICIONAIS AEB</title>
    <link rel="stylesheet" href="../style/style.css">
    <style>
        /* Estilos modernos para página de projetos */
        .projects-page {
            padding: 120px 40px 80px;
            background: radial-gradient(circle at top left, #0f172a, #020617 55%);
            min-height: calc(100vh - 150px);
            color: #e5e7eb;
        }

        .projects-page h1 {
            text-align: center;
            margin: 0 auto 2rem;
            font-size: clamp(2.1rem, 3vw, 2.6rem);
            letter-spacing: -0.04em;
            cursor: default;
            border-radius: 999px;
           /* border: 1px solid rgba(148, 163, 184, 0.4);*/
            color: #e5e7eb;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.35rem 1.8rem;
            background: radial-gradient(circle at top left, rgba(148, 163, 184, 0.22), rgba(15, 23, 42, 0.85));
            /*backdrop-filter: blur(10px);*/
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.8);
        }

        .projects-page h1:hover{
            transform: translateY(-1px) scale(1.02);
            transition: transform 0.25s ease;
        }
        
        .search-section {
            background: rgba(15, 23, 42, 0.4);
            padding: 1.5rem 1.75rem 2.25rem;
            border-radius: 18px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, 0.9);
            margin-bottom: 2.5rem;
            border: 1px solid rgba(148, 163, 184, 0.35);
        }
        
        .search-container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        
        .search-box {
            flex: 1;
            min-width: 300px;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 14px 42px 14px 16px;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.7);
            font-size: 0.95rem;
            background: rgba(15, 23, 42, 0.8);
            color: #e5e7eb;
            transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, color 0.25s ease;
            letter-spacing: 0.5px;
        }
        
        .search-box input::placeholder {
            color: #9ca3af;
            font-style: italic;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.6);
            background-color: rgba(15, 23, 42, 0.98);
        }
        
        .search-box::after {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            opacity: 0.6;
        }
        
        .filter-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-btn {
            padding: 8px 18px;
            border: 1px solid rgba(148, 163, 184, 0.7);
            background: rgba(15, 23, 42, 0.7);
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.25s ease;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.11em;
            color: #cbd5f5;
        }
        
        .filter-btn:hover {
            border-color: rgba(56, 189, 248, 0.9);
            color: #ecfeff;
            box-shadow: 0 18px 45px rgba(56, 189, 248, 0.45);
            background: radial-gradient(circle at top left, #22c55e, #0ea5e9);
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #ecfeff;
            border-color: transparent;
        }
        
        .results-info {
            margin: 0.75rem 0 0 0;
            color: #9ca3af;
            font-size: 0.85rem;
            font-style: italic;
        }
        
        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: #9ca3af;
        }
        
        .no-results h3 {
            margin-bottom: 1rem;
            color: #e5e7eb;
            font-weight: 400;
        }
        
        .projects-section {
            margin-top: 2.5rem;
        }
       /*Projetos*/
        .project-grid {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.25rem;
        }

        .project-item {
            display: flex;
            flex-direction: row;
            height: 220px; 
            border-radius: 14px;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.4);
            box-shadow: 0 22px 70px rgba(15, 23, 42, 0.9);
            position: relative;
            transform: translateY(0);
            transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
        }

        .project-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 26px 80px rgba(15, 23, 42, 1);
            border-color: rgba(56, 189, 248, 0.9);
        }


        .project-thumb { 
            flex: 1 1 100%; 
            height: 220px; 
        }
        .project-thumb img { 
            width: 100%; 
            height: 220px; 
            object-fit: cover; 
            display: block;
            filter: brightness(0.9);
            transition: filter 0.22s ease, transform 0.22s ease;
        }

        .project-item:hover .project-thumb img {
            filter: brightness(1);
            transform: scale(1.03);
        }

        /* Esconder alguns textos; o rótulo aparecerá apenas no hover */
        .project-info, .badge, .turma { display: none !important; }

        .project-label {
            position: absolute;
            top: 14px;
            left: 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 5;
            background: rgba(15, 23, 42, 0.92);
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.7);
            color: #e5e7eb;
            max-width: calc(60% - 24px);
            opacity: 0;
            transform: translateY(-6px);
            transition: opacity 160ms ease, transform 160ms ease;
            pointer-events: none;
            backdrop-filter: blur(10px);
        }

        .project-item:hover .project-label {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .project-category { 
            font-size: 0.7rem; 
            opacity: 0.9; 
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #a5b4fc;
        }
        .project-name { 
            font-size: 0.95rem; 
            font-weight: 600; 
            opacity: 0.97; 
        }
        

        @media (max-width: 900px) {
            .project-grid { grid-template-columns: repeat(2, 1fr); }
            .project-item { height: 180px; }
        }

        @media (max-width: 600px) {
            .project-grid { grid-template-columns: 1fr; }
            .project-item { height: 160px; }
        }
        
        
    </style>
</head>
<body>
    <!-- Menu -->
    <div id="menu"></div>

    <!-- Página de Projetos -->
    <section class="projects-page">
        <div class="container">
            <h1>Projetos</h1>
            
            <!-- Seção de Busca e Filtros -->
            <div class="search-section">
                <div class="search-container">
                    <div class="search-box">
                        <input type="text" id="searchInput" style="color: white;" placeholder="Buscar projetos por nome, turma ou descrição...">
                    </div>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">Todos</button>
                        <button class="filter-btn" data-filter="completo">Completo</button>
                        <button class="filter-btn" data-filter="incompleto">Incompleto</button>
                        <button class="filter-btn" data-filter="ideia">Ideia</button>
                    </div>
                </div>
                <div class="results-info" id="resultsInfo">
                    Carregar projetos...
                </div>
            </div>

            <!-- Seção de Projetos -->
            <div class="projects-section">
                <div  class="project-grid" id="projectGrid" style="display: grid; visibility: visible; opacity: 1; grid-template-columns: repeat( 3, 1fr);">
                    <!-- Projetos carregados aqui -->
                </div>
            </div>
        </div>
    </section>

   

    <!-- Rodapé -->
    <footer id="contato">
        <div class="container">
            <h3>Contato</h3>
            <p>Email: contato@exemplo.com</p>
            <p>Telefone: (11) 1234-5678</p>
            <p>Endereço: Rua Exemplo, 123 - Portalegre, Portugal</p>
            <p>&copy; Cursos Profissionais. Agrupamento de Escolas do Bonfim</p>
        </div>
    </footer>

    <script src="../js/menu-auth.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/projetos-busca.js"></script>

    
    <script>
        // Gerar alturas aleatórias para os projetos
        function applyRandomHeights() {
            const projectItems = document.querySelectorAll('.project-item');
            projectItems.forEach((item) => {
                // Gerar altura aleatória entre 280px e 450px
                const randomHeight = Math.floor(Math.random() * (450 - 280 + 1)) + 280;
                const projectThumb = item.querySelector('.project-thumb');
                if (projectThumb) {
                    projectThumb.style.setProperty('--random-height', randomHeight + 'px');
                }
            });
        }

        // Executar quando o DOM estiver carregado
        document.addEventListener('DOMContentLoaded', applyRandomHeights);
        
        // Re-aplicar ao filtrar projetos
        const filterBtns = document.querySelectorAll('.filter-btn');
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                setTimeout(applyRandomHeights, 100);
            });
        });
        
        // Re-aplicar ao buscar
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', () => {
                setTimeout(applyRandomHeights, 100);
            });
        }
    </script>
</body>
</html>
